buildscript {
    ext.kotlin_version = '1.9.22'  // Update to latest stable
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
      // ✅ Android Gradle Plugin (compatible with Gradle 8.x)
    
        classpath "com.android.tools.build:gradle:8.5.2" // or newer

        // ✅ Kotlin Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // ✅ Flutter Gradle Plugin
        classpath 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

        classpath 'com.android.tools.build:gradle:8.4.0'
        classpath 'com.google.gms:google-services:4.3.15'
        // id 'com.google.gms.google-services' version '4.4.3'

        
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
